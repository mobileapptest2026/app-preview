<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 mensagem nova</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111b21; font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .header { background: #1f2c34; color: white; padding: 15px; width: 100%; max-width: 480px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; }
  .chat { width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  .msg-row { display: flex; opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
  .bubble { background: #202c33; color: white; padding: 10px 15px; border-radius: 8px; font-size: 16px; }
  .bottom { width: 100%; max-width: 480px; padding: 20px; background: #1f2c34; position: sticky; bottom: 0; }
  .cta { width: 100%; background: #25d366; color: white; border: none; padding: 15px; border-radius: 50px; font-weight: 800; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">Chat com Mariana</div>

<div class="chat" id="chat">
  <div class="msg-row"> <div class="bubble">Oi, tudo bem?</div> </div>
  <div class="msg-row"> <div class="bubble">Vi seu perfil e achei interessante</div> </div>
  <div class="msg-row"> <div class="bubble">Quer ver minhas fotos privadas?</div> </div>
</div>

<div class="bottom">
  <button class="cta" id="cta-btn" onclick="redirect()">Desbloquear fotos agora 🔥</button>
</div>

<script>
  // 1. Ссылка BeMob (Без лишних макросов для теста)
  const TRACKER_URL = 'https://zrfny.bemobtrcks.com/go/f2760353-e056-4618-b1b0-15e0fefe77e7';

  // 2. Функция редиректа
  function redirect() {
    const params = window.location.search;
    window.location.replace(TRACKER_URL + params);
  }

  // 3. Плавное появление сообщений
  const messages = document.querySelectorAll('.msg-row');
  messages.forEach((msg, index) => {
    setTimeout(() => {
      msg.style.opacity = '1';
      msg.style.transform = 'translateY(0)';
    }, (index + 1) * 1000); // Появление каждые 1 секунду
  });
</script>

</body>
</html>
