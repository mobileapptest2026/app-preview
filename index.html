<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova mensagem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:20px;
  width:100%;
  max-width:360px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* HEADER */
.header{
  background: linear-gradient(135deg, #e8293a 0%, #c41e2d 100%);
  padding:12px 16px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:600;
}

.header-badge{
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  padding:3px 10px;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
}

.pulse{
  width:7px;
  height:7px;
  background:#4ade80;
  border-radius:50%;
  animation:pulse 1.5s infinite;
  flex-shrink:0;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.4;transform:scale(1.3);}
}

/* DISTANCE BAR */
.distance-bar{
  background:#fff3f3;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#e8293a;
  font-size:13px;
  font-weight:600;
  border-bottom:1px solid #ffe0e0;
}

/* PHOTO */
.photo-container{
  position:relative;
  width:100%;
  height:280px;
  overflow:hidden;
  background:#f0f0f0;
}

.photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo-overlay{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  padding:50px 16px 16px;
  color:#fff;
}

.name{
  font-size:22px;
  font-weight:800;
  margin-bottom:2px;
}

.online-status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  opacity:0.9;
  margin-top:4px;
}

/* MESSAGE */
.message-box{
  padding:16px;
  background:#fff;
}

.message{
  background:#f5f5f5;
  border-radius:16px;
  border-top-left-radius:4px;
  padding:12px 16px;
  font-size:14px;
  color:#333;
  line-height:1.5;
  margin-bottom:14px;
  position:relative;
}

/* LOCKED PHOTOS */
.locked-photos{
  display:flex;
  gap:6px;
  margin-bottom:14px;
}

.locked-photo{
  flex:1;
  height:90px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:#e0e0e0;
}

.locked-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(10px) brightness(0.6);
  transform:scale(1.1);
}

.locked-icon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:20px;
}

/* BUTTONS */
.cta-main{
  width:100%;
  background: linear-gradient(135deg, #e8293a 0%, #c41e2d 100%);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:16px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-bottom:8px;
  box-shadow:0 4px 15px rgba(232,41,58,0.4);
  transition:transform 0.15s;
  -webkit-tap-highlight-color:transparent;
}

.cta-main:active{transform:scale(0.98);}

.cta-secondary{
  width:100%;
  background:#fff;
  color:#e8293a;
  border:2px solid #e8293a;
  border-radius:14px;
  padding:13px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:all 0.15s;
}

.cta-secondary:active{background:#e8293a;color:#fff;}

/* SOCIAL PROOF */
.social-proof{
  text-align:center;
  padding:12px 16px;
  color:#888;
  font-size:12px;
  border-top:1px solid #f0f0f0;
  background:#fafafa;
}

.social-proof strong{color:#e8293a;}

.trust{
  text-align:center;
  padding:8px 16px 12px;
  color:#bbb;
  font-size:11px;
  background:#fafafa;
}
</style>
</head>
<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      📍 <span id="city-header">Perto de você</span>
    </div>
    <div class="header-badge">
      <div class="pulse"></div>
      <span id="online-count">847</span> online
    </div>
  </div>

  <!-- DISTANCE -->
  <div class="distance-bar">
    📍 <span id="distance-text">1.2km de você</span>
  </div>

  <!-- PHOTO -->
  <div class="photo-container">
    <img src="photo1.jpg" alt="" class="photo" id="main-photo"
         onerror="this.style.background='linear-gradient(135deg,#f9c5c5,#c94060)';this.style.width='100%';this.style.height='100%';">
    <div class="photo-overlay">
      <div class="name" id="girl-name">Ana Clara, 22</div>
      <div class="online-status">
        <div class="pulse"></div>
        online agora · <span id="city-overlay">São Paulo</span>
      </div>
    </div>
  </div>

  <!-- MESSAGE + PHOTOS -->
  <div class="message-box">

    <div class="message" id="girl-message">
      Oi! Vi que você está perto 😊 Queria te conhecer melhor... tenho umas fotos pra te mandar 🔥
    </div>

    <div class="locked-photos">
      <div class="locked-photo">
        <img src="photo2.jpg" alt=""
             onerror="this.parentElement.style.background='linear-gradient(135deg,#fde68a,#d97706)';">
        <span class="locked-icon">🔒</span>
      </div>
      <div class="locked-photo">
        <img src="photo3.jpg" alt=""
             onerror="this.parentElement.style.background='linear-gradient(135deg,#bfdbfe,#3b82f6)';">
        <span class="locked-icon">🔒</span>
      </div>
      <div class="locked-photo">
        <img src="avatar.jpg" alt=""
             onerror="this.parentElement.style.background='linear-gradient(135deg,#d9f99d,#16a34a)';">
        <span class="locked-icon">🔒</span>
      </div>
    </div>

    <button class="cta-main" id="cta-main">
      Ver perfil completo 🔥
    </button>
    <button class="cta-secondary" id="cta-secondary">
      Desbloquear fotos privadas 🔒
    </button>

  </div>

  <div class="social-proof">
    👥 <strong id="online-count-2">847</strong> pessoas online agora em <strong id="city-proof">São Paulo</strong>
  </div>

  <div class="trust">
    🔒 Gratuito · Sem cartão · Apenas 18+
  </div>

</div>

<script>
// ============================================================
// ОФФЕР
// ============================================================
const OFFER_URL = 'https://mhx2mrg.lady-topflirt.com/lt7pf6g';

// ============================================================
// ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ
// ============================================================
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

// ============================================================
// ГОРОД
// PushHouse передаёт город через макрос {city} в URL
// В Campaign URL добавь: &city={city}
// Пример: ...?click_id={click_id}&site_id={site}&city={city}
// Если город не передан — показываем "São Paulo" по умолчанию
// ============================================================
const rawCity = getParam('city') || '';

// Декодируем и форматируем город
let city = 'São Paulo';
if(rawCity){
  try{
    city = decodeURIComponent(rawCity);
    // Первая буква заглавная
    city = city.charAt(0).toUpperCase() + city.slice(1).toLowerCase();
  }catch(e){
    city = 'São Paulo';
  }
}

// Подставляем город везде
document.getElementById('city-header').innerText = city;
document.getElementById('city-overlay').innerText = city;
document.getElementById('city-proof').innerText = city;

// Сообщение с городом
document.getElementById('girl-message').innerText =
  'Oi! Vi que você está em ' + city + ' 😊 Queria te conhecer melhor... tenho umas fotos pra te mandar 🔥';

// ============================================================
// ИМЯ из параметра ?name=
// ============================================================
const girlName = getParam('name') || 'Ana Clara';
document.getElementById('girl-name').innerText = girlName + ', 22';

// ============================================================
// РАССТОЯНИЕ — случайное реалистичное
// ============================================================
const dist = (Math.random() * 2.7 + 0.5).toFixed(1);
document.getElementById('distance-text').innerText = dist + 'km de você em ' + city;

// ============================================================
// ОНЛАЙН — случайное неровное число
// ============================================================
const onlineNums = [612, 743, 891, 1034, 567, 823, 956, 734, 681, 1102];
const onlineCount = onlineNums[Math.floor(Math.random() * onlineNums.length)];
document.getElementById('online-count').innerText = onlineCount;
document.getElementById('online-count-2').innerText = onlineCount;

// ============================================================
// REDIRECT
// Берём bemobdata который BeMob добавляет к URL
// ============================================================
function redirectUser(){
  try{
    const bemobdata = getParam('bemobdata') || '';
    let finalUrl = OFFER_URL;
    if(bemobdata){
      finalUrl += '?cid=' + encodeURIComponent(bemobdata);
    }
    window.location.href = finalUrl;
  }catch(e){
    window.location.href = OFFER_URL;
  }
}

document.getElementById('cta-main').addEventListener('click', function(e){
  e.preventDefault();
  redirectUser();
});

document.getElementById('cta-secondary').addEventListener('click', function(e){
  e.preventDefault();
  redirectUser();
});

// BACKBUTTON
history.pushState({}, '', location.href);
window.addEventListener('popstate', function(){
  redirectUser();
});
</script>

</body>
</html>
